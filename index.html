<!DOCTYPE html>
<html>
<head>
    <title>Download</title>
</head>
<body>
    <script>
        window.onload = function() {
            const link = document.createElement('a');
            link.href = '/spcc.py';
            link.download = 'spcc.py';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
